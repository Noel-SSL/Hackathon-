<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Keyboard Database</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #fff; --text: #1a1d21; --muted: #68707c; --border: #dfe3e8;
    --accent: #2f6fed; --chip: #eef1f5; --ok: #1a8a4a; --bad: #b3261e;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14161a; --panel: #1d2026; --text: #e8eaed; --muted: #9aa3ae; --border: #30353d;
      --accent: #6d9bff; --chip: #2a2f37; --ok: #5fd08c; --bad: #ff8a80;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 16px 20px; }
  h1 { font-size: 20px; margin: 0; flex: 1; min-width: 200px; }
  main { padding: 0 20px 40px; }
  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; }
  .filters { display: flex; flex-wrap: wrap; gap: 10px; padding: 12px; margin-bottom: 12px; align-items: end; }
  label { display: flex; flex-direction: column; gap: 3px; font-size: 12px; color: var(--muted); }
  label.check { flex-direction: row; align-items: center; gap: 6px; font-size: 13px; color: var(--text); }
  input, select, button { font: inherit; color: var(--text); background: var(--panel);
    border: 1px solid var(--border); border-radius: 6px; padding: 6px 8px; }
  input[type=number] { width: 90px; }
  button { cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button:disabled { opacity: .55; cursor: default; }
  #count { color: var(--muted); margin: 0 0 8px 2px; }
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border); vertical-align: middle; }
  th { font-size: 12px; color: var(--muted); white-space: nowrap; user-select: none; }
  th[data-sort] { cursor: pointer; }
  th[data-sort]:hover { color: var(--text); }
  tr:last-child td { border-bottom: 0; }
  td img { width: 56px; height: 56px; object-fit: cover; border-radius: 6px; display: block; background: var(--chip); }
  td.name a { color: var(--accent); text-decoration: none; font-weight: 600; }
  td.name a:hover { text-decoration: underline; }
  td.price { white-space: nowrap; font-variant-numeric: tabular-nums; }
  .chip { display: inline-block; background: var(--chip); border-radius: 10px; padding: 1px 8px; margin: 1px 2px 1px 0; font-size: 12px; }
  .muted { color: var(--muted); }
  .in { color: var(--ok); } .out { color: var(--bad); }
  #log { margin: 0 0 12px; padding: 10px 12px; max-height: 160px; overflow: auto; white-space: pre-wrap;
         font: 12px/1.5 ui-monospace, Menlo, monospace; color: var(--muted); }
  .empty { padding: 40px; text-align: center; color: var(--muted); }
</style>
</head>
<body>
<header>
  <h1>Keyboard Database</h1>
  <label class="check" title="Uses the Anthropic API to fill in size/material the rules could not find. Needs credentials and costs API usage.">
    <input type="checkbox" id="llm"> Fill gaps with LLM</label>
  <button class="primary" id="scrape">Scrape shops now</button>
</header>
<main>
  <pre id="log" class="panel" hidden></pre>
  <div class="panel filters">
    <label>Search name <input id="q" type="search" placeholder="e.g. Tofu"></label>
    <label>Shop <select id="shop"></select></label>
    <label>Size <select id="size"></select></label>
    <label>Material <select id="material"></select></label>
    <label>Switch <input id="switch" type="search" placeholder="e.g. Brown"></label>
    <label>Min price <input id="min_price" type="number" min="0"></label>
    <label>Max price <input id="max_price" type="number" min="0"></label>
    <label class="check"><input type="checkbox" id="in_stock"> In stock only</label>
    <button id="reset">Reset</button>
  </div>
  <p id="count"></p>
  <div class="panel table-wrap">
    <table>
      <thead><tr>
        <th></th>
        <th data-sort="keyboard_name">Name</th>
        <th data-sort="shop">Shop</th>
        <th data-sort="size">Size</th>
        <th data-sort="built_material">Material</th>
        <th>Switches</th>
        <th data-sort="price">Price</th>
        <th>Stock</th>
      </tr></thead>
      <tbody id="rows"></tbody>
    </table>
    <div id="empty" class="empty" hidden></div>
  </div>
</main>
<script>
const $ = id => document.getElementById(id);
const FILTERS = ["q", "shop", "size", "material", "switch", "min_price", "max_price"];
const LABELS = {keyboard_name: "Name", shop: "Shop", size: "Size", built_material: "Material", price: "Price"};
let sort = "keyboard_name", order = "asc", total = 0;

function el(tag, props = {}, ...children) {
  const node = Object.assign(document.createElement(tag), props);
  node.append(...children);
  return node;
}

function safeUrl(url) {
  return typeof url === "string" && url.startsWith("https://") ? url : null;
}

function money(k) {
  if (k.price == null) return "—";
  const fmt = n => new Intl.NumberFormat("en-US", {style: "currency", currency: k.currency || "USD"}).format(n);
  return k.price_max > k.price ? `${fmt(k.price)} – ${fmt(k.price_max)}` : fmt(k.price);
}

function fillSelect(select, values, withUnknown) {
  const current = select.value;
  select.replaceChildren(el("option", {value: "", textContent: "All"}));
  for (const v of values) select.append(el("option", {value: v, textContent: v}));
  if (withUnknown) select.append(el("option", {value: "unknown", textContent: "Unknown"}));
  select.value = current;
}

async function loadFacets() {
  const f = await (await fetch("/api/facets")).json();
  total = f.total;
  fillSelect($("shop"), f.shops);
  fillSelect($("size"), f.sizes, true);
  fillSelect($("material"), f.materials, true);
}

async function load() {
  const params = new URLSearchParams({sort, order});
  for (const id of FILTERS) if ($(id).value.trim()) params.set(id, $(id).value.trim());
  if ($("in_stock").checked) params.set("in_stock", "1");
  const data = await (await fetch("/api/keyboards?" + params)).json();

  $("rows").replaceChildren(...data.keyboards.map(k => {
    const img = safeUrl(k.image_url);
    const link = safeUrl(k.source_url);
    const switches = k.switches.length
      ? k.switches.slice(0, 8).map(s => el("span", {className: "chip", textContent: s}))
      : [el("span", {className: "muted", textContent: "—"})];
    if (k.switches.length > 8) switches.push(el("span", {className: "muted", textContent: ` +${k.switches.length - 8} more`}));
    return el("tr", {},
      el("td", {}, img ? el("img", {src: img, alt: "", loading: "lazy"}) : ""),
      el("td", {className: "name"}, link
        ? el("a", {href: link, target: "_blank", rel: "noopener noreferrer", textContent: k.keyboard_name})
        : k.keyboard_name),
      el("td", {textContent: k.shop}),
      el("td", {textContent: k.size || "—"}),
      el("td", {textContent: k.built_material || "—"}),
      el("td", {}, ...switches),
      el("td", {className: "price", textContent: money(k)}),
      el("td", {className: k.available ? "in" : "out", textContent: k.available ? "In stock" : "Sold out"}),
    );
  }));

  $("count").textContent = `${data.count} of ${total} keyboards`;
  $("empty").hidden = data.count > 0;
  $("empty").textContent = total === 0
    ? "The database is empty. Click “Scrape shops now” to fill it."
    : "No keyboards match these filters.";
  for (const th of document.querySelectorAll("th[data-sort]")) {
    const arrow = th.dataset.sort === sort ? (order === "asc" ? " ▲" : " ▼") : "";
    th.textContent = LABELS[th.dataset.sort] + arrow;
  }
}

async function pollScrape() {
  const state = await (await fetch("/api/scrape")).json();
  if (state.log.length) {
    $("log").hidden = false;
    $("log").textContent = state.log.join("\n");
    $("log").scrollTop = $("log").scrollHeight;
  }
  $("scrape").disabled = state.running;
  $("scrape").textContent = state.running ? "Scraping…" : "Scrape shops now";
  if (state.running) {
    setTimeout(pollScrape, 1500);
  } else if (state.log.length) {
    await loadFacets();
    await load();
  }
}

$("scrape").addEventListener("click", async () => {
  $("scrape").disabled = true;
  await fetch("/api/scrape", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({llm: $("llm").checked}),
  });
  pollScrape();
});

let timer;
for (const id of [...FILTERS, "in_stock"]) {
  $(id).addEventListener("input", () => { clearTimeout(timer); timer = setTimeout(load, 200); });
}
$("reset").addEventListener("click", () => {
  for (const id of FILTERS) $(id).value = "";
  $("in_stock").checked = false;
  load();
});
for (const th of document.querySelectorAll("th[data-sort]")) {
  th.addEventListener("click", () => {
    order = th.dataset.sort === sort && order === "asc" ? "desc" : "asc";
    sort = th.dataset.sort;
    load();
  });
}

loadFacets().then(load).then(pollScrape);
</script>
</body>
</html>
